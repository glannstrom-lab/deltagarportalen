name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# D8 (2026-07-23): köa deploys i stället för att köra parallellt.
# cancel-in-progress medvetet false — en halvfärdig deploy ska få göra
# klart; nästa körning tar den senaste koden ändå.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  deploy-supabase:
    name: Deploy Supabase Migrations
    runs-on: ubuntu-latest
    environment: production
    needs: deploy-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # OBS: Migrationer körs INTE automatiskt här.
      # `supabase db push` försöker köra ALLA migrationer och fail:ar på konflikter
      # (se CLAUDE.md). Migrationer körs manuellt med:
      #   npx supabase db query --linked -f supabase/migrations/<fil>.sql
      # Skapa en GH Actions issue eller pre-deploy-checklista för att ej glömma.

      - name: Deploy Edge Functions
        run: supabase functions deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-supabase]
    # K1 (2026-08-05): `environment: production` saknades här medan båda
    # deploy-jobben hade den. Hemligheter som ligger på produktionsmiljön är
    # då TOMMA i det här jobbet — därav att "API health check" fallit varje
    # deploy sedan minst 2026-08-03 medan funktionen själv svarar 200 healthy
    # (verifierat med anon-nyckeln ur client/.env).
    environment: production

    steps:
      - name: Wait for deployment
        run: sleep 30

      - name: Health check
        run: |
          response=$(curl -sL -o /dev/null -w "%{http_code}" https://jobin.se)
          if [ "$response" != "200" ]; then
            echo "Health check failed with status: $response"
            exit 1
          fi
          echo "Health check passed"

      # K1 (2026-08-05): robots.txt och sitemap.xml fanns inte, och
      # SPA-catch-allen svarade då med index.html och status 200. En 200 som är
      # HTML ser ut som "filen finns" i varje ytlig kontroll — därför mäts
      # Content-Type här, inte statuskoden.
      - name: SEO baseline (robots.txt + sitemap.xml)
        run: |
          set -e
          robots_type=$(curl -sSI https://www.jobin.se/robots.txt | tr -d '\r' \
            | awk -F': ' 'tolower($1)=="content-type"{print tolower($2)}')
          case "$robots_type" in
            text/plain*) echo "robots.txt: $robots_type OK" ;;
            *) echo "robots.txt levereras som '$robots_type' — förväntade text/plain. SPA-fallbacken har troligen fångat den igen."; exit 1 ;;
          esac

          sitemap_type=$(curl -sSI https://www.jobin.se/sitemap.xml | tr -d '\r' \
            | awk -F': ' 'tolower($1)=="content-type"{print tolower($2)}')
          case "$sitemap_type" in
            application/xml*|text/xml*) echo "sitemap.xml: $sitemap_type OK" ;;
            *) echo "sitemap.xml levereras som '$sitemap_type' — förväntade application/xml."; exit 1 ;;
          esac

          curl -sS https://www.jobin.se/sitemap.xml | grep -q '<urlset' \
            || { echo "sitemap.xml saknar <urlset> — inte en giltig sitemap."; exit 1; }
          echo "SEO baseline OK"

      # K1 (2026-08-05): headers-blocket i client/vercel.json var inaktivt i
      # prod (Vercel tillåter inte `routes` + `headers` i samma fil; `routes`
      # vann tyst). Deployen gick igenom utan varning, så bara ett utfallsmått
      # fångar en regression här.
      - name: Security headers
        run: |
          set -e
          headers=$(curl -sSI https://www.jobin.se/ | tr -d '\r' | tr 'A-Z' 'a-z')
          for h in content-security-policy x-frame-options x-content-type-options referrer-policy; do
            echo "$headers" | grep -q "^$h:" || { echo "Saknad header: $h"; exit 1; }
          done
          echo "$headers" | grep -q "frame-ancestors 'none'" \
            || { echo "CSP saknar frame-ancestors 'none'."; exit 1; }
          echo "$headers" | grep -q "includesubdomains" \
            || { echo "HSTS saknar includeSubDomains — Vercels default gäller, inte vår konfig."; exit 1; }
          echo "Security headers OK"

      # A15 (2026-07-23): health-funktionen kräver anon-JWT (verifierat: 401
      # utan, 200 med) — curlen skickade ingen, därför var steget satt till
      # continue-on-error och kunde aldrig larma. Nu skarp kontroll.
      # Utan den här kontrollen blir en saknad hemlighet ett obegripligt
      # "API health check failed with status: 000" — vilket är precis vad som
      # dolde miljöbuggen ovan i två dygn.
      - name: Kontrollera att hemligheterna finns
        run: |
          saknas=""
          [ -z "${{ secrets.SUPABASE_URL }}" ] && saknas="$saknas SUPABASE_URL"
          [ -z "${{ secrets.VITE_SUPABASE_ANON_KEY }}" ] && saknas="$saknas VITE_SUPABASE_ANON_KEY"
          if [ -n "$saknas" ]; then
            echo "Saknade hemligheter i miljön 'production':$saknas"
            echo "Lägg till dem under Settings → Environments → production."
            exit 1
          fi
          echo "Hemligheter OK"

      - name: API health check
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            ${{ secrets.SUPABASE_URL }}/functions/v1/health)
          if [ "$response" != "200" ]; then
            echo "API health check failed with status: $response"
            exit 1
          fi
          echo "API health check passed"
