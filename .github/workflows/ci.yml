name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# D8 (2026-07-23): avbryt föregående körning vid snabba på-varandra-följande
# pushar till samma branch/PR — sparar CI-minuter och kortar kön.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      # I3 (2026-07-27): spärr uppåt på warnings, inte bara på errors.
      # Taket är 129 = läget efter att no-console-skulden betalats. Resten är
      # react-hooks-regler (exhaustive-deps, set-state-in-effect m.fl.) som inte
      # går att fixa mekaniskt — att lägga till en dependency eller flytta ett
      # setState ändrar beteende. Grinden stoppar därför nytillskott medan den
      # befintliga skulden betas av per rörd fil. Sänk talet när du sänker skulden.
      - name: Run ESLint (0 errors, max 129 warnings)
        working-directory: client
        run: npm run lint:ci

      - name: Type check (crash-class)
        working-directory: client
        run: npm run typecheck:critical

      # I2 (2026-07-27): spärr uppåt på hela strict-skulden, inte bara
      # krasch-klassen. Taket är 687 = laget vid infrandet. Nya typfel gor
      # bygget rott; skulden kan bara minska. Sank talet i scriptet nar du
      # betalar av. Fangade omedelbart 7 fel som testerna och
      # typecheck:critical bada slapp igenom — bl.a. en hook som returnerade
      # en raderad funktion (ReferenceError i korning).
      - name: Type check (strict-tak 687)
        working-directory: client
        run: npm run typecheck:ceiling

      - name: Design debt — gradient regression guard
        working-directory: client
        run: npm run lint:design

      # Schemadrift (H1, 2026-07-27): failar när koden refererar tabeller,
      # kolumner, RPC eller storage-buckets som inte finns i produktions-
      # schemat. Jämför mot supabase/schema-snapshot.json — ingen DB-åtkomst
      # och därmed inga hemligheter i CI. Snapshoten uppdateras manuellt med
      # `npm run schema:refresh` efter varje körd migration.
      - name: Schema drift — kod vs. produktionsschema
        working-directory: client
        run: npm run lint:schema

      # Vercel-konfig (K1, 2026-08-05): två skarpa fel har gått till prod på
      # client/vercel.json — `routes` som tyst dödade headers-blocket, och en
      # capture-grupp i en header-source som fällde `vercel build` på 35 s.
      # Grinden validerar mot path-to-regexp ur @vercel/node, alltså exakt
      # den parser Vercel kör. Billigare här än i en misslyckad deploy.
      - name: Vercel-konfig — routing och headers
        working-directory: client
        run: npm run lint:vercel

  # D18 (2026-08-09): `test` och `coverage` är två jobb, inte ett.
  #
  # Varför: fram till nu körde det här jobbet `test:coverage`, och `build` hade
  # `needs: [lint-and-typecheck, test]`. En coveragetröskel som föll stängde
  # därmed av build, lighthouse och BÅDA e2e-jobben — i månader. En trendmätare
  # ska aldrig kunna släcka grinden som mäter om koden ens bygger.
  #
  # Uppdelningen behåller båda signalerna: `test` är den riktiga pass/fail-
  # grinden och gatar fortfarande `build`; `coverage` failar synligt men har
  # noll nedströmsberoenden. Priset är att sviten körs två gånger.
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      # Supabase-env behövs INTE här: `vitest.config.ts` sätter icke-funktionella
      # testvärden (D17). Sätt dem inte tillbaka — enhetssviten ska aldrig nå ett
      # riktigt backend, och beroendet på en gitignorerad `client/.env` var
      # precis det som gjorde CI-felet osynligt lokalt i 687 körningar.
      - name: Run tests
        working-directory: client
        run: npm run test:run
        env:
          CI: true

  coverage:
    name: Coverage (informerande — inga nedströmsberoenden)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Run tests with coverage
        working-directory: client
        run: npm run test:coverage
        env:
          CI: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: client/coverage
          retention-days: 30

      # D17-följd: rapporten laddades tidigare bara upp som artefakt, och
      # sammanfattningen skrevs bara för pull_request. Eftersom projektet
      # arbetar direkt på main hade ingen någonsin sett CI:s faktiska
      # coveragesiffra. Skriv den alltid.
      - name: Coverage summary
        if: always()
        working-directory: client
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "## Test Coverage" >> $GITHUB_STEP_SUMMARY
            node -e "
              const s = require('./coverage/coverage-summary.json').total;
              console.log('| Metric | % |');
              console.log('|--------|---|');
              console.log('| Lines | ' + s.lines.pct + '% |');
              console.log('| Functions | ' + s.functions.pct + '% |');
              console.log('| Branches | ' + s.branches.pct + '% |');
              console.log('| Statements | ' + s.statements.pct + '% |');
            " >> $GITHUB_STEP_SUMMARY
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Build application
        working-directory: client
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: client/dist
          retention-days: 7

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build
          path: client/dist

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.13.x

      # DR4 (2026-08-22): flaggorna låg tidigare här — tio stycken som
      # dubblerade och skuggade `.lighthouserc.js`, så ingen kunde läsa ut
      # vad som faktiskt gällde. All konfiguration bor nu i rc-filen; det
      # här steget kör den och inget annat.
      #
      # Diagnostiken: jobbet har fallit sedan 2 april med enda spåret "No
      # files were found with the provided path: .lighthouseci", alltså att
      # collect dog innan något skrevs. `@lhci/cli` saknar try/catch i sin
      # collect-loop, så orsaken syns aldrig i loggen. Nu skrivs innehållet
      # i katalogen ut innan steget faller.
      - name: Run Lighthouse CI
        run: |
          lhci healthcheck --fatal || true
          lhci autorun || {
            echo "::group::.lighthouseci efter misslyckad koerning"
            ls -la .lighthouseci 2>/dev/null || echo "(katalogen finns inte)"
            for f in .lighthouseci/*.log; do
              [ -f "$f" ] && { echo "--- $f"; tail -n 80 "$f"; }
            done
            echo "::endgroup::"
            exit 1
          }
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci
          retention-days: 30

  e2e-smoke:
    name: E2E Smoke (public pages)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install root dependencies (Playwright)
        run: npm ci

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        # D8 (2026-07-23): regression-fas-a tillagd — låg i repot men kördes
        # aldrig i CI (publika vakter: modulepreload, upload-image-auth, routes)
        run: npx playwright test e2e/smoke.spec.ts e2e/regression-fas-a.spec.ts --project=chromium
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # D1 (2026-07-10): Authenticated E2E. Specarna själv-skippar när
  # TEST_USER_EMAIL saknas — jobbet är alltså grönt-men-tomt tills
  # secrets TEST_USER_EMAIL/TEST_USER_PASSWORD (och valfritt
  # TEST_CONSULTANT_EMAIL/TEST_CONSULTANT_PASSWORD) läggs in i repot.
  e2e-authenticated:
    name: E2E Authenticated (golden path)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install root dependencies (Playwright)
        run: npm ci

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run authenticated E2E
        # D8 (2026-07-23): axe-a11y tillagd — WCAG-svepet kördes aldrig i CI.
        # Publika sidor auditeras alltid; inloggade sidor när secrets finns.
        # D9 (2026-07-23): sta.spec.ts tillagd — STA/Arbetsprövning (en av de
        # fyra huvudfunktionerna) hade ingen e2e-täckning alls.
        run: npx playwright test e2e/golden-path.spec.ts e2e/auth.spec.ts e2e/cv.spec.ts e2e/dashboard.spec.ts e2e/cover-letter.spec.ts e2e/job-search.spec.ts e2e/axe-a11y.spec.ts e2e/sta.spec.ts --project=chromium
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          TEST_CONSULTANT_EMAIL: ${{ secrets.TEST_CONSULTANT_EMAIL }}
          TEST_CONSULTANT_PASSWORD: ${{ secrets.TEST_CONSULTANT_PASSWORD }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-authenticated
          path: playwright-report
          retention-days: 7

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      # Riktig gate sedan 2026-07-23 (A14 klar: @vercel/blob@2.6.1 → 0 prod-
      # sårbarheter). --omit=dev är medvetet: dev-beroenden skeppas inte
      # (@vercel/node pinnar t.ex. fortfarande en gammal undici som Vercel
      # måste släppa fix för — den ska inte fälla CI).
      - name: Run npm audit (production dependencies)
        working-directory: client
        run: npm audit --omit=dev --audit-level=high

      # D21 (2026-08-09): den här grinden scannade ingenting.
      #
      # `base: main` + `head: HEAD` ger en TOM diff vid push till main — och
      # push till main är den enda väg projektet använder. Grinden var alltså
      # per definition en no-op på 100 % av körningarna. Kombinerat med att
      # repot är publikt och att ett prod-konsulentlösenord faktiskt har legat
      # i klartext i historiken (A33) var det inte en teoretisk lucka.
      #
      # Utan base/head gör TruffleHog en filsystemsscanning av arbetsträdet:
      # den kan inte bli tom, och den fångar hemligheter som ligger i filer nu.
      # Historiken är ett separat engångsjobb — se A33 i ROADMAP.
      #
      # Actionen är dessutom pinnad. `@main` på en tredjeparts-action som får
      # läsa hela repot är en supply chain-risk vi inte behöver ta.
      - name: Check for secrets
        uses: trufflesecurity/trufflehog@v3.96.0
        with:
          path: ./
          extra_args: --only-verified
